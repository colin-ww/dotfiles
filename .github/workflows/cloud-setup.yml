name: cloud-setup
# Tests claude-code/cloud/R-setup.sh before it reaches main (the cloud env
# downloads it from main). Catches apt/CRAN name typos fast, then runs the
# whole script for real on noble.
on:
  pull_request:
    paths: &paths
      - "claude-code/cloud/**"
      - "!claude-code/cloud/README.md"
      - "!claude-code/cloud/scan-repo-deps.R"
      - "!claude-code/cloud/r-packages-installed.csv"  # generated by CI below
      - ".github/workflows/cloud-setup.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install codespell  # spell check, used by check.sh
      - run: bash claude-code/cloud/check.sh

  full-run:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # to commit r-packages-installed.csv back
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}  # the branch, not PR merge commit, so we can push
      - name: Run R-setup.sh (config from this checkout, not main)
        timeout-minutes: 4  # cloud env caches only if setup < ~5 min
        run: sudo CFG_DIR="$PWD/claude-code/cloud" STRICT=1 bash claude-code/cloud/R-setup.sh  # STRICT: any WARN = red
      - name: "Package inventory csv + every pkg installed and loads (catches missing system libs)"
        run: Rscript claude-code/cloud/pkg-inventory.R
      - name: Commit csv if it changed
        # pushes made with the built-in token don't trigger CI again (no loop)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-code/cloud/r-packages-installed.csv
          git diff --cached --quiet || { git commit -m "Update r-packages-installed.csv (CI)"; git push; }
