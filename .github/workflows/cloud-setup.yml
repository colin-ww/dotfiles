name: cloud-setup
# Tests claude-code/cloud/R-setup.sh before it reaches main (the cloud env
# downloads it from main). Catches apt/CRAN name typos fast, then runs the
# whole script for real, on 2 Ubuntu releases (see strategy below).
on:
  pull_request:
    paths: &paths
      - "claude-code/cloud/**"
      - "!claude-code/cloud/README.md"
      - "!claude-code/cloud/scan-repo-deps.R"
      - "!claude-code/cloud/r-packages-installed.csv"  # generated by CI below
      - ".github/workflows/cloud-setup.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

jobs:
  check:
    # Both releases, side by side (parallel: same wall time, 2x minutes):
    #   ubuntu-24.04  = noble, what the cloud env runs today (2026-11-24)
    #   ubuntu-latest = whatever GitHub calls latest (26.04 resolute today),
    #                   i.e. what the cloud env will likely move to next
    # Nothing to bump by hand: scripts read the release from /etc/os-release.
    # Only when GitHub retires the ubuntu-24.04 label (years) does that leg
    # stop starting -> drop it then (or earlier, once the cloud env is on 26.04).
    strategy: &releases
      fail-fast: false  # one release red shouldn't cancel the other
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - &mirror  # reused in full-run. check.sh runs apt-get update too
        name: Use the cloud env's apt mirror (archive.ubuntu.com), not the runner's
        # 2026-11-19: runner's us-east-2.ec2.archive.ubuntu.com crawled at ~50 KB/s,
        # setup timed out mid-download (92 of 232 debs). 2026-11-24: check.sh's
        # apt-get update took 2 min on it. Cloud env uses archive.ubuntu.com,
        # so this also makes the 4-min timing closer to the real thing.
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          grep -rhE "^(URIs|deb )" /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null || true
      - run: pip install codespell  # spell check, used by check.sh
      - run: bash claude-code/cloud/check.sh

  full-run:
    needs: check
    strategy: *releases  # same 2 releases as check (see there)
    name: full-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write  # to commit r-packages-installed.csv back
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}  # the branch, not PR merge commit, so we can push
      - name: "Release: which Ubuntu is this runner?"
        # (runner has no R before setup: checked 2026-11-24, image 20261116)
        run: . /etc/os-release; echo "$PRETTY_NAME ($VERSION_CODENAME), image ${ImageVersion:-?}"
      - *mirror  # see check
      - name: Run R-setup.sh (config from this checkout, not main)
        timeout-minutes: 4  # cloud env caches only if setup < ~5 min
        run: sudo CFG_DIR="$PWD/claude-code/cloud" STRICT=1 bash claude-code/cloud/R-setup.sh  # STRICT: any WARN = red
      - name: "Package inventory csv + every pkg installed and loads (catches missing system libs)"
        run: Rscript claude-code/cloud/pkg-inventory.R
      - name: Commit csv if it changed
        if: matrix.os == 'ubuntu-24.04'  # one leg only: csv comes from CRAN metadata, same on both
        # [skip ci]: else GitHub creates a run for the bot's commit that sits at
        # "action_required" (awaiting approval). Built-in token = no loop either way.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-code/cloud/r-packages-installed.csv
          git diff --cached --quiet || { git commit -m "Update r-packages-installed.csv (CI) [skip ci]"; git push; }
